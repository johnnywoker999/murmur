name: Deploy MURMUR AI (site + workspace + canvas)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ---------- 1. 官網（純靜態，直接複製） ----------
      - name: Assemble landing at site root
        run: |
          mkdir -p dist
          cp -r site/. dist/
          touch dist/.nojekyll

      # ---------- 2. 創作工作台 → /murmur-ai/ ----------
      - name: Install workspace deps
        working-directory: web
        run: bun install --frozen-lockfile || bun install

      - name: Build workspace
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/murmur-ai/
        run: bun run build:desktop

      - name: Move workspace build
        run: |
          mkdir -p dist/murmur-ai
          cp -r web/dist/. dist/murmur-ai/
          # 深層連結回退：未知路徑交給工作台路由處理
          cp dist/murmur-ai/index.html dist/404.html

      # ---------- 3. 無限畫布 → /murmur-canvas/ ----------
      - name: Clone canvas repo
        id: canvas
        continue-on-error: true
        run: git clone --depth 1 "https://github.com/${OWNER}/murmur-canvas.git" canvas-src

      - name: Build canvas
        if: steps.canvas.outcome == 'success'
        working-directory: canvas-src/web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/murmur-canvas/
        run: |
          bun install --frozen-lockfile || bun install
          bun run build
          mkdir -p ../../dist/murmur-canvas
          cp -r dist/. ../../dist/murmur-canvas/
          # GitHub Pages 沒有 SPA 重寫：為已知深連結預生成實體頁面，
          # 否則 /murmur-canvas/canvas 會落到根 404.html（工作台殼）。
          mkdir -p ../../dist/murmur-canvas/canvas
          cp dist/index.html ../../dist/murmur-canvas/canvas/index.html

      - name: Note missing canvas
        if: steps.canvas.outcome != 'success'
        run: echo "::warning::murmur-canvas 倉庫尚未建立或建置失敗，畫布入口會是 404"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
